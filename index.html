<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>黑豹代理</title><link rel="stylesheet" href="/style.css?v=20261119-features5"><script src="/app.js?v=20261119-features5" defer></script><script src="/features.js?v=20261119-features5" defer></script></head>
<body>
<main id="app">
  <section id="login" hidden><div class="brand"><svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12Z"/><path d="m12 7 5 5-5 5-5-5Z"/></svg><div><h1>黑豹代理</h1><p>连接你的代理服务</p></div></div><form id="login-form"><label for="secret">管理密钥</label><input id="secret" type="password" autocomplete="current-password" placeholder="填写现有 XD 管理密钥" required><button class="primary wide" type="submit">连接</button></form></section>
  <section id="home" hidden>
    <div class="brand"><svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12Z"/><path d="m12 7 5 5-5 5-5-5Z"/></svg><div><h1>黑豹代理</h1><p>你的家庭网络</p></div></div>
    <button id="power" class="home-card power"><span class="big-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M5.6 5.6a9 9 0 1 0 12.8 0"/></svg></span><span class="card-copy"><strong id="power-title">读取状态…</strong><span id="power-detail">正在连接</span></span></button>
    <button id="open-nodes" class="home-card"><span class="big-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/><rect x="15" y="15" width="6" height="6"/></svg></span><span class="card-copy"><strong>节点</strong><span id="node-summary">自动选择</span></span><span class="chevron"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button>
    <button id="open-profiles" class="home-card"><span class="big-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg></span><span class="card-copy"><strong>订阅</strong><span id="profile-summary">读取订阅…</span></span><span class="chevron"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button>
    <button id="open-devices" class="home-card"><span class="big-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="3" width="14" height="11" rx="2"/><path d="M6 19h6M9 14v5"/><rect x="17" y="10" width="5" height="11" rx="1"/></svg></span><span class="card-copy"><strong>设备</strong><span>管理哪些设备使用代理</span></span><span class="chevron">›</span></button>
    <p id="status-line" class="status-line">正在连接黑豹</p>
  </section>
  <section id="nodes" hidden>
    <header class="page-header"><button class="icon-button back" aria-label="返回首页"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><h1>节点</h1><button id="test-nodes" class="icon-button" aria-label="测速" title="测速"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 2-8 12h6l-1 8 9-12h-6Z"/></svg></button></header>
    <nav id="group-tabs" aria-label="策略组"></nav><p id="node-hint" class="hint"></p><div id="node-grid" class="node-grid"></div>
  </section>
  <section id="profiles" hidden>
    <header class="page-header"><button class="icon-button back" aria-label="返回首页"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><h1>订阅</h1><button id="update-all" class="icon-button" aria-label="更新全部订阅" title="更新全部"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 6a8 8 0 0 1 13 3M18 18a8 8 0 0 1-13-3"/></svg></button><button id="add-profile" class="icon-button" aria-label="添加订阅" title="添加订阅"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></header>
    <p id="profile-status" class="profile-status" role="status" hidden></p><div id="profile-list" role="radiogroup" aria-label="选择订阅"></div><button id="provider-import" class="provider-entry">从服务商网站导入</button>
  </section>
<section id="devices" hidden><header class="page-header"><button class="icon-button back" aria-label="返回首页">‹</button><h1>设备</h1><button id="refresh-devices" class="icon-button" aria-label="刷新设备">↻</button></header><p id="devices-status" class="feature-status" role="status">正在读取设备…</p><p id="devices-error" class="feature-status error" role="status"></p><div id="device-list"></div><p class="device-note">显示黑豹发现过的设备，点名称可备注。直连设备和智能家居无需开启。私人随机地址变化后会视作新设备。</p></section>
<section id="provider" hidden><header class="page-header"><button class="icon-button back" aria-label="返回首页">‹</button><h1>服务商导入</h1></header><p id="provider-status" class="feature-status" role="status">正在准备…</p><form id="provider-login" class="provider-login" hidden autocomplete="off"><label for="provider-email">飞鸟云账号</label><input id="provider-email" type="email" autocomplete="off" required><label for="provider-password">密码</label><input id="provider-password" type="password" autocomplete="off" required><button type="submit" class="primary wide">登录并自动导入</button><p class="device-note">账号密码只用于本次登录，不保存。有效登录窗口可在短时间内复用。</p></form><div id="provider-human" hidden><p class="device-note">这是黑豹的同一个登录窗口，完成验证后自动继续。可直接点击图片中的控件。</p><div class="provider-window"><img id="provider-screen" alt="飞鸟云登录窗口" draggable="false"></div><div class="remote-input"><input id="provider-text" type="password" autocomplete="off" placeholder="先点图片中的输入框，再在这里输入" aria-label="输入到登录窗口"><button id="provider-send" class="small-button">输入</button><button id="provider-enter" class="small-button">回车</button><button id="provider-scroll-up" class="small-button">上翻</button><button id="provider-scroll-down" class="small-button">下翻</button></div></div><div class="feature-actions"><button id="provider-cancel" class="small-button" hidden>取消导入</button><button id="provider-retry" class="primary" hidden>重新尝试</button><button id="provider-list" class="primary" hidden>查看订阅</button></div></section>
</main><dialog id="device-name-dialog"><form id="device-name-form"><div class="dialog-title"><h2>设备名称</h2><button type="button" id="close-device-name" class="icon-button" aria-label="关闭">×</button></div><input id="device-mac" type="hidden"><label for="device-name">备注名称</label><input id="device-name" maxlength="50" placeholder="例如：我的手机 / 客厅电视"><button class="primary wide" type="submit">保存</button></form></dialog>
<dialog id="import-dialog"><form id="import-form"><div class="dialog-title"><h2>添加订阅</h2><button type="button" id="close-import" class="icon-button" aria-label="关闭"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><label for="profile-name">名称</label><input id="profile-name" placeholder="例如：常用订阅 / 备用订阅" maxlength="80"><label for="profile-url">订阅链接</label><input id="profile-url" type="text" placeholder="https://…" required autocomplete="off"><button type="submit" class="primary wide">导入订阅</button></form></dialog>
<dialog id="provider-dialog"><form id="provider-form"><div class="dialog-title"><h2>服务商订阅</h2><button type="button" id="close-provider" class="icon-button" aria-label="关闭服务商导入">×</button></div><a class="provider-site" href="https://feiniaoyun.xyz/#/dashboard" target="_blank" rel="noopener noreferrer">打开飞鸟云网站 ↗</a><p class="provider-help">登录并完成验证，点“一键订阅 → 复制订阅地址”，返回这里粘贴导入。</p><label for="provider-name">订阅名称</label><input id="provider-name" value="飞鸟云" maxlength="80"><label for="provider-url">网站复制的订阅地址</label><input id="provider-url" type="text" required autocomplete="off" placeholder="支持订阅地址或 Clash 一键链接"><p id="provider-error" role="status" class="provider-help"></p><button type="submit" class="primary wide">导入订阅</button></form></dialog>
<div id="toast" role="status" hidden></div><div id="busy" hidden><span class="spinner"></span><span id="busy-text">处理中…</span></div>
</body></html>
